# ---------------------------------------------------------------------------
# Brings up Postgres + the Call Review API together.
#   docker compose up -d --build
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-call_review_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: DB port is NOT published to the host on purpose — the app reaches it
    # over the internal network at host "db". To inspect it from the host, add:
    #   ports: ["5433:5432"]   (5433 to avoid clashing with a host Postgres)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-call_review_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env           # injects GEMINI_API_KEY, GROQ_API_KEY, DATABASE_URL, etc.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"   # set APP_PORT in .env (e.g. 8123) to avoid host clashes
    volumes:
      - ./audio_files:/app/audio_files   # persist downloaded/temp audio

volumes:
  pgdata:
